name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - circleci-project-setup
jobs:
    generate:
      permissions:
        contents: write

      runs-on: ubuntu-latest
      timeout-minutes: 5

      steps:
        - name: Generate snake SVG files
          uses: Platane/snk/svg-only@v3
          with:
            github_user_name: h4tikk
            outputs: |
              dist/snake-dark.svg?color_snake=%2339d353&color_dots=%23161b22,%230e4429,%23006432,%2326a641,%2339d353

        - name: Publish SVG files to output branch
          uses: crazy-max/ghaction-github-pages@v3.1.0
          with:
            target_branch: output
            build_dir: dist
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
